<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Helen</title>
  </head>
  <body>
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>

    <pre id="debug"></pre>
    <button id="debugToggle" type="button">dbg</button>

    <div id="controls" hidden>
      <div class="row">
        <button id="demoBtn" type="button">Demo: biggest</button>
        <button id="confirmBtn" type="button">What is this?</button>
        <button id="resetBtn" type="button">Reset</button>
        <button id="handBtn" type="button">Hand: OFF</button>
      </div>
      <button id="findBtn" type="button">Find my beer</button>
    </div>

    <div id="startScreen">
      <button id="startBtn" type="button">Start</button>
      <p id="startMsg"></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
